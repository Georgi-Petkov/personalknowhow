name = "personalknowhow-site"
main = "src/index.ts"
compatibility_date = "2026-08-14"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "personalknowhow-waitlist"
database_id = "934afff4-c462-41b0-91ff-2232473c5286"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "personalknowhow-storage"

# Separate dataset from mcp/mcp-private/mcp-customer-template's "mcp_usage" --
# that one is MCP tool-call traffic, this is marketing-site engagement
# (CTA clicks). Different concern, own dataset.
[[analytics_engine_datasets]]
binding = "SITE_EVENTS"
dataset = "site_events"

[[routes]]
pattern = "personalknowhow.com"
custom_domain = true

[observability]
enabled = true
