name: Send Invite

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email to invite. Leave blank to auto-pick the oldest waitlist signup without an invite yet."
        required: false

jobs:
  invite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Create invite and send email
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INVITE_EMAIL: ${{ inputs.email }}
        run: python .github/scripts/send_invite.py
