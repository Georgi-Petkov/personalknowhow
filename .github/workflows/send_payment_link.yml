name: Send Payment Link

on:
  workflow_dispatch:
    inputs:
      token:
        description: "Invite token (upload must already be done) to send a payment link for."
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Send payment link email
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INVITE_TOKEN: ${{ inputs.token }}
        run: python .github/scripts/send_payment_link.py
