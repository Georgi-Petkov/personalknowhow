name: Retention Expiry

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Auto-delete invites past the 90-day retention window
        env:
          CF_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CF_R2_TOKEN: ${{ secrets.CLOUDFLARE_R2_AI_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python .github/scripts/retention_expiry.py
