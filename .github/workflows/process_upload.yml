name: Process Customer Upload

on:
  workflow_dispatch:
    inputs:
      upload_key:
        description: "R2 object key of the uploaded zip, e.g. raw/<uuid>.zip"
        required: true

env:
  CLOUDFLARE_ACCOUNT_ID: "716dcf9e5806cc9dbb777e0b80bb236d"
  D1_DATABASE_ID: "934afff4-c462-41b0-91ff-2232473c5286"

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Download the customer's upload from R2 ────────────────────────────
      - name: Download upload from R2
        env:
          CLOUDFLARE_R2_AI_TOKEN: ${{ secrets.CLOUDFLARE_R2_AI_TOKEN }}
          UPLOAD_KEY: ${{ inputs.upload_key }}
        run: |
          curl -sf -o /tmp/upload.zip \
            -H "Authorization: Bearer $CLOUDFLARE_R2_AI_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/personalknowhow-storage/objects/$UPLOAD_KEY"

      # ── Look up this customer's public/private slugs -- derived once, at waitlist
      #    signup time, from a secret HMAC over their email (site/src/index.ts's
      #    deriveSlug). Never hand-typed, so there's nothing here to collide or leak
      #    an identity-adjacent name into a public URL. ──────────────────────────
      - name: Look up customer slugs
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          UPLOAD_KEY: ${{ inputs.upload_key }}
        run: |
          D1_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"

          EMAIL=$(curl -sf -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,sys; print(json.dumps({'sql': 'SELECT email FROM upload_invites WHERE r2_upload_key = ?', 'params': [sys.argv[1]]}))" "$UPLOAD_KEY")" \
            "$D1_URL" | python3 -c "import json,sys; r=json.load(sys.stdin)['result'][0]['results']; print(r[0]['email'] if r else '')")

          if [ -z "$EMAIL" ]; then
            echo "::error::No upload_invites row found for upload_key=$UPLOAD_KEY"
            exit 1
          fi

          SLUGS=$(curl -sf -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,sys; print(json.dumps({'sql': 'SELECT public_slug, private_slug FROM subscribers WHERE email = ?', 'params': [sys.argv[1]]}))" "$EMAIL")" \
            "$D1_URL")

          PUBLIC_SLUG=$(echo "$SLUGS" | python3 -c "import json,sys; r=json.load(sys.stdin)['result'][0]['results']; print(r[0]['public_slug'] if r else '')")
          PRIVATE_SLUG=$(echo "$SLUGS" | python3 -c "import json,sys; r=json.load(sys.stdin)['result'][0]['results']; print(r[0]['private_slug'] if r else '')")

          if [ -z "$PUBLIC_SLUG" ] || [ -z "$PRIVATE_SLUG" ]; then
            echo "::error::No slugs found for $EMAIL -- was this email ever submitted through /api/waitlist?"
            exit 1
          fi

          {
            echo "EMAIL=$EMAIL"
            echo "PUBLIC_SLUG=$PUBLIC_SLUG"
            echo "PRIVATE_SLUG=$PRIVATE_SLUG"
          } >> "$GITHUB_ENV"
          echo "Resolved slugs for $EMAIL: public=$PUBLIC_SLUG private=$PRIVATE_SLUG"

      # ── Validate BEFORE extracting anything -- reads the zip's central directory
      #    only, never extracts a byte. Rejects zip bombs, path-traversal entries,
      #    and anything that doesn't actually look like a LinkedIn export. ─────────
      - name: Validate upload is a safe, real LinkedIn export
        id: validate
        run: |
          if ! python ingest/validate_linkedin_export.py /tmp/upload.zip > /tmp/validate_result.txt 2>&1; then
            echo "rejected=true" >> "$GITHUB_OUTPUT"
            cat /tmp/validate_result.txt
          else
            echo "rejected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Quarantine and record rejection
        if: steps.validate.outputs.rejected == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_R2_AI_TOKEN: ${{ secrets.CLOUDFLARE_R2_AI_TOKEN }}
          UPLOAD_KEY: ${{ inputs.upload_key }}
        run: |
          REASON=$(cat /tmp/validate_result.txt | tr -d '\n' | cut -c1-500)
          QUARANTINE_KEY="quarantine/$(basename "$UPLOAD_KEY")"
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/personalknowhow-storage/objects"

          # Move, don't just flag -- the object no longer lives under raw/ where a
          # retry could pick it up again.
          curl -sf -X PUT -H "Authorization: Bearer $CLOUDFLARE_R2_AI_TOKEN" \
            --data-binary "@/tmp/upload.zip" "$BASE/$QUARANTINE_KEY"
          curl -sf -X DELETE -H "Authorization: Bearer $CLOUDFLARE_R2_AI_TOKEN" \
            "$BASE/$UPLOAD_KEY"

          curl -sf -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/934afff4-c462-41b0-91ff-2232473c5286/query" \
            -d "$(python3 -c "import json,sys; print(json.dumps({'sql': 'UPDATE upload_invites SET upload_rejected_reason = ? WHERE r2_upload_key = ?', 'params': [sys.argv[1], sys.argv[2]]}))" "$REASON" "$UPLOAD_KEY")"

          echo "::error::Upload rejected and quarantined: $REASON"
          exit 1

      - name: Extract validated upload
        run: |
          DEST="data/incoming/extracted/linkedin_$PUBLIC_SLUG"
          mkdir -p "$DEST"
          unzip -o /tmp/upload.zip -d "$DEST"

          # LinkedIn's zip layout varies -- CSVs can be at the top level, or one
          # level deeper inside a nested folder. Find wherever Certifications.csv
          # actually landed, ignoring macOS metadata junk, rather than assuming.
          CSV_FILE=$(find "$DEST" -name "Certifications.csv" -not -path "*/__MACOSX/*" -print -quit)
          if [ -z "$CSV_FILE" ]; then
            echo "::error::Certifications.csv not found anywhere under $DEST"
            exit 1
          fi
          CSV_DIR=$(dirname "$CSV_FILE")
          echo "CSV_DIR=$CSV_DIR" >> "$GITHUB_ENV"
          echo "Resolved CSV directory: $CSV_DIR"

      # ── Run the existing, unmodified pipeline ─────────────────────────────
      - name: Run LinkedIn ingest
        run: |
          python ingest/linkedin_ingest.py \
            --extract-dir "$CSV_DIR" \
            --json-summary

      - name: Merge corpus
        run: python ingest/merge.py

      - name: Build knowledge graph
        run: python ingest/build_graph.py

      # ── Build both tiers unconditionally -- every customer gets both a public
      #    (safe, unauthenticated-capable) and a private (full, bearer-token-gated)
      #    export in one run, instead of picking one at process time. ─────────────
      - name: Build public export
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_R2_AI_TOKEN }}
        run: python ingest/build_public_export.py

      - name: Build private export
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_R2_AI_TOKEN }}
        run: python ingest/build_private_export.py

      # ── Upload both results to R2 — never committed to git ─────────────────
      - name: Upload results to R2
        env:
          CLOUDFLARE_R2_AI_TOKEN: ${{ secrets.CLOUDFLARE_R2_AI_TOKEN }}
        run: |
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/personalknowhow-storage/objects"

          curl -sf -X PUT -H "Authorization: Bearer $CLOUDFLARE_R2_AI_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@mcp/public_entries.json" "$BASE/customers/$PUBLIC_SLUG/entries.json"
          curl -sf -X PUT -H "Authorization: Bearer $CLOUDFLARE_R2_AI_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@mcp/public_embeddings.json" "$BASE/customers/$PUBLIC_SLUG/embeddings.json"

          curl -sf -X PUT -H "Authorization: Bearer $CLOUDFLARE_R2_AI_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@mcp-private/private_entries.json" "$BASE/customers/$PRIVATE_SLUG/entries.json"
          curl -sf -X PUT -H "Authorization: Bearer $CLOUDFLARE_R2_AI_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@mcp-private/private_embeddings.json" "$BASE/customers/$PRIVATE_SLUG/embeddings.json"

          echo "Wrote customers/$PUBLIC_SLUG/{entries,embeddings}.json (public) and customers/$PRIVATE_SLUG/{entries,embeddings}.json (private) to R2."

      # ── The raw LinkedIn export is deliberately KEPT here, not auto-deleted. ──
      #    Removed 2026-08-23 after it caused real, unrecoverable data loss: this
      #    step used to delete raw/<uuid>.zip immediately as "GDPR data
      #    minimization," on the reasoning that nothing downstream reads the raw
      #    zip again once entries.json/embeddings.json exist. That reasoning
      #    didn't hold -- adding the related_entries MCP tool needed graph
      #    relationship data that only exists in the raw export, not in the
      #    already-built entries/embeddings, and christian@nexio.ae's raw upload
      #    (processed via this exact workflow) was already gone by the time that
      #    need showed up, with no copy anywhere else. The live privacy policy
      #    (site/public/privacy/) never promised immediate auto-deletion -- it
      #    only promises deletion ON REQUEST, via the "Delete my data" button or
      #    emailing privacy@personalknowhow.com, both of which still work
      #    unchanged and remain the actual deletion mechanism for a raw upload
      #    (see site/'s /api/delete-data). r2_upload_key is left as-is (not
      #    nulled) so a future job can still find the raw file to rebuild from.
